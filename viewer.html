<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF-Ansicht</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { padding: 0; }
    .toolbar {
      position: sticky; top: 0; z-index: 2;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .toolbar .spacer { flex: 1; }
    #status { color: var(--muted); font-size: 13px; }
    #page-wrap { padding: 16px; display: flex; justify-content: center; }
    #page { position: relative; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.25); background: #fff; }
    #page canvas { display: block; }
    .mark {
      position: absolute;
      background: var(--mark);
      mix-blend-mode: multiply;
      border-radius: 2px;
      animation: pulse 1.2s ease-in-out 2;
    }
    @keyframes pulse { 50% { outline: 3px solid #e0a800; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="prev" aria-label="Vorherige Seite">‹</button>
    <span id="page-label">–</span>
    <button id="next" aria-label="Nächste Seite">›</button>
    <span class="spacer"></span>
    <span id="status">Lade PDF …</span>
  </div>
  <div id="page-wrap"><div id="page"></div></div>
  <script type="module" src="viewer.js"></script>
</body>
</html>
